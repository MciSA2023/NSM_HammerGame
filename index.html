<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aatm Manthan - Die Erblühende Welt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="exhibition-scene">

        <div id="sky-background"
            style="position: absolute; width: 100%; height: 100%; background: linear-gradient(to bottom, #5a6577 0%, #323b4c 100%); z-index: 0;">
        </div>

        <div id="day-sky"
            style="position: absolute; width: 100%; height: 100%; background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); z-index: 1; opacity: var(--day-opacity, 1); transition: opacity 0.1s linear;">
        </div>

        <div id="storm-overlay"></div>

        <div id="sun-rays"></div>
        <div id="sun-glow"></div>

        <div id="bg-mountains-back" class="parallax-layer">
            <div class="mountain-track track-slow">
                <div class="mountain-img m3 normal"></div>
                <div class="mountain-img m3 mirrored"></div>
                <div class="mountain-img m3 normal"></div>
                <div class="mountain-img m3 mirrored"></div>
            </div>
        </div>

        <div id="bg-mountains-mid" class="parallax-layer">
            <div class="mountain-track track-mid">
                <div class="mountain-img m2 normal"></div>
                <div class="mountain-img m2 mirrored"></div>
                <div class="mountain-img m2 normal"></div>
                <div class="mountain-img m2 mirrored"></div>
            </div>
        </div>

        <div id="bg-mountains-front" class="parallax-layer">
            <div class="mountain-track track-fast">
                <div class="mountain-img m1 normal"></div>
                <div class="mountain-img m1 mirrored"></div>
                <div class="mountain-img m1 normal"></div>
                <div class="mountain-img m1 mirrored"></div>
            </div>
        </div>

        <div id="clouds-container">
            <img src="Clouds.png" class="cloud cloud-left" alt="Gewitterwolke">
            <img src="Clouds.png" class="cloud cloud-right" alt="Gewitterwolke">
        </div>

        <canvas id="rain-canvas"></canvas>

        <div id="ground-night" class="ground-layer">
            <div class="ground-track">
                <div class="ground-img night normal"></div>
                <div class="ground-img night mirrored"></div>
                <div class="ground-img night normal"></div>
                <div class="ground-img night mirrored"></div>
            </div>
        </div>

        <div id="ground-day" class="ground-layer">
            <div class="ground-track">
                <div class="ground-img day normal"></div>
                <div class="ground-img day mirrored"></div>
                <div class="ground-img day normal"></div>
                <div class="ground-img day mirrored"></div>
            </div>
        </div>

        <div id="addons-layer">
            <div class="bush-track">
                <img src="assets/addons/bush1.png" class="addon" style="left: 10%;" alt="Busch">
                <img src="assets/addons/flower1.png" class="addon" style="left: 45%; height: 60%;" alt="Blume">
                <img src="assets/addons/bush1.png" class="addon" style="left: 85%; height: 80%;" alt="Busch">

                <img src="assets/addons/bush1.png" class="addon" style="left: 110%;" alt="Busch">
                <img src="assets/addons/flower1.png" class="addon" style="left: 145%; height: 60%;" alt="Blume">
                <img src="assets/addons/bush1.png" class="addon" style="left: 185%; height: 80%;" alt="Busch">
            </div>
        </div>

        <div id="person-wrapper">
            <div id="person-colorful" style="background-image: url('assets/character/Colourfullpeople.png');"></div>

            <div id="person-cover"></div>
        </div>

        <div id="ui-overlay">
            <div id="percentage-text">0.0 <span class="percent-sign">%</span></div>
            <div id="milestone-message"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
